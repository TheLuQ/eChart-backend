steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - gcloud
      - services
      - enable
      - cloudresourcemanager.googleapis.com
      - eventarc.googleapis.com

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - gcloud
      - beta
      - services
      - identity
      - create
      - --service=eventarc.googleapis.com
      - --project=$PROJECT_ID

  # Create GCS bucket for Terraform state
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - gcloud
      - storage
      - buckets
      - create
      - gs://${PROJECT_ID}-tfstate
      - --location=europe-central2

  # Initialize Terraform (uses the GCS backend created above)
  - name: hashicorp/terraform:light
    args:
      - init
      - -backend-config=bucket=$PROJECT_ID-tfstate

  # Plan Terraform changes
  - name: hashicorp/terraform:light
    id: plan
    args:
      - plan
      - -var=PROJECT_ID=$PROJECT_ID

  # Apply Terraform changes (waits for 'plan')
  - name: hashicorp/terraform:light
    id: apply
    waitFor:
      - plan
    args:
      - apply
      - -auto-approve
      - -var=PROJECT_ID=$PROJECT_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    dir: ./cloud-functions
    waitFor:
      - apply
    args:
      - gcloud
      - functions
      - deploy
      - my-function-add
      - --gen2
      - --region=europe-central2
      - --entry-point=AddEvent
      - --trigger-resource=$PROJECT_ID-source-mock-bucket
      - --trigger-event=google.cloud.storage.object.v1.finalized
      - --concurrency=1
      - --cpu=.08
      - --memory=128Mi
      - --max-instances=1
      - --runtime=go125
      - --source=.
      - --update-labels=version=${_TAG_NAME}
      - --set-env-vars=PROJECT_ID=$PROJECT_ID,DB=sheets,SHEET_STORAGE_BUCKET=$PROJECT_ID-source-mock-bucket


  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    dir: ./cloud-functions
    waitFor:
      - apply
    args:
      - gcloud
      - functions
      - deploy
      - my-function-remove
      - --gen2
      - --region=europe-central2
      - --entry-point=RemoveEvent
      - --trigger-resource=$PROJECT_ID-source-mock-bucket
      - --trigger-event=google.cloud.storage.object.v1.deleted
      - --max-instances=1
      - --memory=128Mi
      - --runtime=go125
      - --source=.
      - --set-env-vars=PROJECT_ID=$PROJECT_ID,DB=sheets,SHEET_STORAGE_BUCKET=$PROJECT_ID-source-mock-bucket

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: build-api
    dir: .
    waitFor:
      - apply
    args:
      - gcloud
      - builds
      - submit
      - --config=cloudbuild-api.yaml
      - --region=europe-central2

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: build-frontend
    dir: ./eChart
    waitFor:
      - apply
    args:
      - gcloud
      - builds
      - submit
      - --config=api/cloudbuild.yaml
      - --region=europe-central2

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    dir: ./cloud-functions
    waitFor:
      - build-api
    args:
      - gcloud
      - run
      - deploy
      - my-function-api
      - --region=europe-central2
      - --allow-unauthenticated
      - --base-image=go125
      - --concurrency=1
      - --cpu=.08
      - --memory=128Mi
      - --max-instances=1
      - --no-deploy-health-check
      - --image=europe-central2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/my-function-api:latest
      - --set-env-vars=PROJECT_ID=$PROJECT_ID,DB=sheets,EVENTS_COLLECTION=events,SHEET_STORAGE_BUCKET=$PROJECT_ID-source-mock-bucket

options:
  logging: CLOUD_LOGGING_ONLY
